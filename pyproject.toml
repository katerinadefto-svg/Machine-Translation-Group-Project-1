[project]
name = "machine-translation-group-project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # datasets>=5 requires pyarrow>=21, which requires numpy>=2 (conflicts with unbabel-comet)
    "datasets<5",
    "evaluate>=0.4.6",
    "matplotlib>=3.11.2",
    "pandas>=3.0.0",
    # unbabel-comet pins numpy<2; pyarrow>=20 requires numpy>=2
    "pyarrow<20",
    "python-dotenv>=1.2.4",
    "requests>=2.32.0",
    "sacrebleu>=2.6.0",
    "sacremoses>=0.2.0",
    "sentencepiece>=0.2.3",
    # torchmetrics (via unbabel-comet) imports pkg_resources, removed in setuptools>=81
    "setuptools<81",
    "torch>=2.10.0",
    # transformers>=5 requires huggingface-hub>=1, conflicting with unbabel-comet
    "transformers<5",
    "unbabel-comet>=2.2.7",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
